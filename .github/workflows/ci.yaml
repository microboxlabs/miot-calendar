# =============================================================================
# MIOT Calendar - Build and Publish
# =============================================================================
# This workflow builds and publishes:
#
# Build Modes:
#   - JVM: Standard Java JAR build
#   - Native: GraalVM native executable
#
# Docker Images to:
#   - GitHub Container Registry (GHCR) - Primary registry
#   - Docker Hub - Secondary mirror (releases only)
#
# Maven Artifacts to:
#   - GitHub Packages - All builds
#   - Maven Central (via Sonatype Central Portal) - Releases only
#
# Tagging Strategy:
#   - PRs:        ghcr.io/<org>/<image>:pr-<number>
#   - main/trunk: ghcr.io/<org>/<image>:latest
#   - Tags:       ghcr.io/<org>/<image>:<version> + Maven Central release
#
# Required Secrets:
#   Docker Hub:
#     - DOCKERHUB_USERNAME: Docker Hub username
#     - DOCKERHUB_TOKEN: Docker Hub access token
#   Maven Central (Sonatype):
#     - SONATYPE_USERNAME: Sonatype Central username
#     - SONATYPE_PASSWORD: Sonatype Central password
#     - GPG_PRIVATE_KEY: ASCII-armored GPG private key for signing
#     - GPG_PASSPHRASE: GPG key passphrase
# =============================================================================

name: Build and Publish

run-name: ${{ github.actor }} is building miot-calendar 🗓️

on:
  push:
    branches:
      - trunk
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - trunk
      - main

env:
  # Registry configuration
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  # Java/Maven configuration
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  # Quarkus native image builder
  MANDREL_IMAGE: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

jobs:
  # ===========================================================================
  # Build JVM - Compile, Test, and Package (fast feedback)
  # ===========================================================================
  build-jvm:
    name: Build JVM
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "📦 Release version: $VERSION"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "📦 Snapshot version: $VERSION"
          fi

      - name: Build and Test with Maven
        run: mvn -B verify --file pom.xml

      - name: Upload JVM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jvm-build
          path: |
            target/quarkus-app/
            src/main/docker/Dockerfile.jvm
          retention-days: 1

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: mvn -B deploy -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Build Native - GraalVM Native Executable
  # ===========================================================================
  build-native:
    name: Build Native
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: /github/home/.m2/repository
          key: ${{ runner.os }}-maven-native-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-native-

      - name: Build Native Executable
        run: ./mvnw package -Pnative -DskipTests
        env:
          MAVEN_OPTS: -Dmaven.repo.local=/github/home/.m2/repository

      - name: Upload Native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: |
            target/*-runner
            src/main/docker/Dockerfile.native
          retention-days: 1

  # ===========================================================================
  # Publish Docker Images (JVM)
  # ===========================================================================
  docker-jvm:
    name: Docker JVM Image
    runs-on: ubuntu-latest
    needs: build-jvm

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JVM artifacts
        uses: actions/download-artifact@v4
        with:
          name: jvm-build
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ github.event_name != 'pull_request' && format('{0}/{1}', env.DOCKERHUB_REGISTRY, env.IMAGE_NAME) || '' }}
          flavor: |
            suffix=-jvm
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MIOT Calendar (JVM)
            org.opencontainers.image.description=Calendar booking microservice for resource scheduling
            org.opencontainers.image.vendor=MicroboxLabs

      - name: Build and push JVM Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output JVM image information
        run: |
          echo "## Docker JVM Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Publish Docker Images (Native)
  # ===========================================================================
  docker-native:
    name: Docker Native Image
    runs-on: ubuntu-latest
    needs: build-native

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-build
          path: .

      - name: Prepare native executable
        run: |
          chmod +x target/*-runner
          ls -la target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ github.event_name != 'pull_request' && format('{0}/{1}', env.DOCKERHUB_REGISTRY, env.IMAGE_NAME) || '' }}
          flavor: |
            suffix=-native
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MIOT Calendar (Native)
            org.opencontainers.image.description=Calendar booking microservice for resource scheduling (GraalVM native)
            org.opencontainers.image.vendor=MicroboxLabs

      - name: Build and push Native Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Native image information
        run: |
          echo "## Docker Native Image Published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Publish to Maven Central (Releases Only)
  # ===========================================================================
  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build-jvm
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set release version
        run: |
          mvn -B versions:set -DnewVersion=${{ needs.build-jvm.outputs.version }} -DgenerateBackupPoms=false

      - name: Publish to Maven Central
        run: mvn -B deploy -Prelease -DskipTests
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Output Maven publish information
        run: |
          echo "## Maven Central Release Published 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Group ID:** com.microboxlabs" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact ID:** miot-calendar" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build-jvm.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          echo "<dependency>" >> $GITHUB_STEP_SUMMARY
          echo "  <groupId>com.microboxlabs</groupId>" >> $GITHUB_STEP_SUMMARY
          echo "  <artifactId>miot-calendar</artifactId>" >> $GITHUB_STEP_SUMMARY
          echo "  <version>${{ needs.build-jvm.outputs.version }}</version>" >> $GITHUB_STEP_SUMMARY
          echo "</dependency>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-jvm
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-jvm'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
