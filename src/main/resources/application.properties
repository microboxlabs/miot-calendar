# Application
quarkus.application.name=miot-calendar

# HTTP
quarkus.http.port=8083
%test.quarkus.http.port=8084

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/miot_calendar

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=miot_calendar
quarkus.flyway.default-schema=miot_calendar

# Hibernate - let Flyway handle schema
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=miot_calendar
# Use standard JSON mapping for JSONB columns (avoid Jackson REST customizations)
quarkus.hibernate-orm.mapping.format.global=ignore

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=MIOT Calendar API
quarkus.smallrye-openapi.info-version=0.2.1
quarkus.smallrye-openapi.info-description=Calendar booking microservice for resource scheduling. Provides calendar management, time window configuration, slot generation, and booking operations.
quarkus.smallrye-openapi.info-contact-name=MicroBoxLabs
quarkus.smallrye-openapi.info-contact-url=https://microboxlabs.com
quarkus.smallrye-openapi.servers=/
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.microboxlabs.miot.calendar".level=DEBUG

# Dev Services (for local development)
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.devservices.image-name=postgres:16
%dev.quarkus.datasource.devservices.db-name=miot_calendar

# Test profile - uses real database (CI provides PostgreSQL service container)
# Dev services disabled for tests to avoid Testcontainers dependency
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true

# OIDC - Bearer token (resource server mode)
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/dev}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:miot-calendar}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:}

# Disable OIDC in test profile; @TestSecurity takes full control
%test.quarkus.oidc.enabled=false
# Disable OIDC in dev unless provider is available locally
%dev.quarkus.oidc.enabled=${OIDC_ENABLED:false}

# Slot Manager scheduler
# Cron: top of every hour by default. Set to "off" to disable inner scheduler
# (use K8s CronJob or CLI mode instead: java -jar miot-calendar.jar run-slots)
miot-calendar.slot-manager.cron=0 0 * * * ?
# For HA: add quarkus-quartz dependency and set:
#   quarkus.quartz.store-type=jdbc-cmt
#   quarkus.quartz.clustered=true

# OpenAPI: emit BearerAuth security scheme automatically
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth
quarkus.smallrye-openapi.auto-add-security=true
